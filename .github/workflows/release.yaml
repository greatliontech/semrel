name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Build semrel
        run: go build -o semrel .

      - name: Get versions
        id: semrel
        run: |
          current=$(./semrel current)
          next=$(./semrel)
          echo "current-version=$current" >> $GITHUB_OUTPUT
          echo "next-version=$next" >> $GITHUB_OUTPUT
          if [ "$current" = "$next" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No version change detected ($current)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version bump: $current -> $next"
          fi

      - name: Skip release
        if: steps.semrel.outputs.skip == 'true'
        run: echo "No changes to release, skipping."

      - uses: docker/login-action@v3
        if: steps.semrel.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: thegrumpylion
          password: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.semrel.outputs.skip == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.semrel.outputs.next-version }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.semrel.outputs.current-version }}

      - name: Update major version tag
        if: steps.semrel.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract major version from next-version (e.g., v1.2.3 -> v1)
          next="${{ steps.semrel.outputs.next-version }}"
          major=$(echo "$next" | sed -E 's/^(v?[0-9]+).*/\1/')

          # Ensure it starts with 'v'
          if [[ ! "$major" =~ ^v ]]; then
            major="v$major"
          fi

          echo "Updating major version tag: $major -> $next"

          # Delete the old major tag if it exists (locally and remote)
          git tag -d "$major" 2>/dev/null || true
          git push origin ":refs/tags/$major" 2>/dev/null || true

          # Create and push the new major tag pointing to this release
          git tag "$major" "$next"
          git push origin "$major"

          echo "Successfully updated $major to point to $next"

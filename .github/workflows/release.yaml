name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  GO_VERSION: "1.24"

jobs:
  semrel:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check for release
        id: check
        run: |
          CURRENT=$(go run . current --json | jq -r '.version')
          NEXT=$(go run . --json | jq -r '.version')

          echo "Current: $CURRENT"
          echo "Next: $NEXT"

          if [ "$CURRENT" = "$NEXT" ]; then
            echo "No release needed"
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "released=true" >> $GITHUB_OUTPUT
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Create draft release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.check.outputs.version }}
          NOTES=$(go run . release --notes-only)
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            --draft

  build:
    needs: semrel
    if: needs.semrel.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${{ needs.semrel.outputs.version }}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/semrel${EXT} .

      - name: Generate completions (Linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p completions
          ./dist/semrel completion bash > completions/semrel.bash
          ./dist/semrel completion zsh > completions/semrel.zsh
          ./dist/semrel completion fish > completions/semrel.fish

      - name: Create archive
        run: |
          VERSION=${{ needs.semrel.outputs.version }}
          mkdir -p release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dist/semrel.exe release/
            cp LICENSE release/
            cd release && zip ../semrel_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip *
          else
            cp dist/semrel release/
            cp LICENSE release/
            cd release && tar -czvf ../semrel_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz *
          fi

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.semrel.outputs.version }}
          gh release upload "v${VERSION}" semrel_*.tar.gz semrel_*.zip --clobber || true

      - name: Upload completions artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: completions
          path: completions/

  publish:
    needs: [semrel, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.semrel.outputs.version }}
          gh release edit "v${VERSION}" --draft=false --repo ${{ github.repository }}

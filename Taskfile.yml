# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BINARY: semrel
  INSTALL_DIR: ~/.local/bin

tasks:
  default:
    desc: Build the binary
    cmds:
      - task: build

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}} .

  install:
    desc: Install to ~/.local/bin
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - go build -o {{.INSTALL_DIR}}/{{.BINARY}} .
    sources:
      - ./**/*.go
    generates:
      - ~/.local/bin/{{.BINARY}}

  install:completions:
    desc: Install shell completions
    cmds:
      - |
        case "$SHELL" in
          */zsh)
            mkdir -p ~/.zsh/completions
            {{.INSTALL_DIR}}/{{.BINARY}} completion zsh > ~/.zsh/completions/_{{.BINARY}}
            echo "Installed zsh completions to ~/.zsh/completions/_{{.BINARY}}"
            echo "Add 'fpath=(~/.zsh/completions \$fpath)' to ~/.zshrc if not already present"
            ;;
          */bash)
            mkdir -p ~/.local/share/bash-completion/completions
            {{.INSTALL_DIR}}/{{.BINARY}} completion bash > ~/.local/share/bash-completion/completions/{{.BINARY}}
            echo "Installed bash completions to ~/.local/share/bash-completion/completions/{{.BINARY}}"
            ;;
          */fish)
            mkdir -p ~/.config/fish/completions
            {{.INSTALL_DIR}}/{{.BINARY}} completion fish > ~/.config/fish/completions/{{.BINARY}}.fish
            echo "Installed fish completions to ~/.config/fish/completions/{{.BINARY}}.fish"
            ;;
          *)
            echo "Unknown shell: $SHELL"
            exit 1
            ;;
        esac
    deps:
      - install

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY}} coverage.out coverage.html

  schema:
    desc: Regenerate JSON schema
    cmds:
      - go run scripts/schema.go > config.schema.json

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test:race

  release:dry:
    desc: Show what the next version would be
    cmds:
      - go run . --dry-run

  release:current:
    desc: Show current version
    cmds:
      - go run . current
